# Backend + Redis. Results, pub/sub and canvas state live in Redis; there is no SQL database.
# The frontend runs separately (`cd frontend && npm run dev`) or on any static host.
services:
  backend:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - faiss_data:/app/data/faiss_indices

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  faiss_data:
  redis_data:
